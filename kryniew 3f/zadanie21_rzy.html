<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Zadanie 21</title>

<script>
function V(r,h) {
    var r_liczba = parseFloat(r);
    var h_liczba = parseFloat(h);
    var V_wynik = Math.PI * r_liczba * r_liczba * h_liczba;

    document.getElementsByName("obj")[0].value = V_wynik.toFixed(2);
    alert("V = " + V_wynik.toFixed(2) + " cm³");
    document.getElementById("pokaz1").innerHTML =
    "V = " + V_wynik.toFixed(2) + " cm³";
}

function Pc(r,h) {
    var r_liczba = parseFloat(r);
    var h_liczba = parseFloat(h);
    var Pc_wynik = 2*Math.PI*r_liczba*r_liczba +
                   2*Math.PI*r_liczba*h_liczba;

    document.getElementsByName("pole")[0].value = Pc_wynik.toFixed(2);
    alert("Pc = " + Pc_wynik.toFixed(2) + " cm²");
    document.getElementById("pokaz2").innerHTML =
    "Pc = " + Pc_wynik.toFixed(2) + " cm²";
}
</script>
</head>

<body>
<h2>Obliczanie V i Pc walca</h2>

<form name="formularz" onsubmit="
V(this.promien.value,this.wysokosc.value);
Pc(this.promien.value,this.wysokosc.value);
return false;">

Podaj r:
<input size="6" name="promien" type="number" step="any">

Podaj h:
<input size="6" name="wysokosc" type="number" step="any">

<br><br>
<input type="submit" value="Oblicz">

<br><br>
V =
<input size="10" name="obj" readonly>

Pc =
<input size="10" name="pole" readonly>
</form>

<table>
<tr><td id="pokaz1"></td></tr>
<tr><td id="pokaz2"></td></tr>
</table>
</body>
</html>
